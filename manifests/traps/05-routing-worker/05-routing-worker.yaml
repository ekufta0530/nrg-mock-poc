# TRAP 5 (Super) — routing-engine sizes its worker pool from /sys/fs/cgroup/cpu.weight,
# which the kubelet derives from requests.cpu. Nothing in this spec reveals it.
#   2000m -> 8 workers -> ~8 jobs/s capacity vs 6 jobs/s arrival, ~0.6 cores used (30%: the bait)
#   ~650m -> 2-3 workers -> queue grows, usage FALLS -> WOOP recommends lower -> spiral
# The worker re-reads cpu.weight every 30s, so in-place resizes (no restart) trigger it too.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routing-engine
  namespace: routing
  labels: { app: routing-engine, team: dispatch }
spec:
  replicas: 1
  selector:
    matchLabels: { app: routing-engine }
  template:
    metadata:
      labels: { app: routing-engine, team: dispatch }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: nrg-worker
          env:
            - { name: MODE, value: queue }
            - { name: SERVICE_NAME, value: routing-engine }
            - { name: REDIS_HOST, value: redis-queue }
            - { name: JOB_CPU_MS, value: "100" }
            - { name: JOB_IO_MS, value: "900" }
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: "2", memory: 1Gi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
