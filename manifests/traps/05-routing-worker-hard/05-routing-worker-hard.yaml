# TRAP 5 (Hard) — same coupling, but visible in the pod spec via the Downward API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routing-engine
  namespace: routing
  labels: { app: routing-engine, team: dispatch }
spec:
  replicas: 1
  selector:
    matchLabels: { app: routing-engine }
  template:
    metadata:
      labels: { app: routing-engine, team: dispatch }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: nrg-worker
          env:
            - { name: MODE, value: queue }
            - { name: SERVICE_NAME, value: routing-engine }
            - { name: REDIS_HOST, value: redis-queue }
            - { name: JOB_CPU_MS, value: "100" }
            - { name: JOB_IO_MS, value: "900" }
            - name: CPU_REQUEST_MILLI
              valueFrom:
                resourceFieldRef: { containerName: worker, resource: requests.cpu, divisor: 1m }
          # Downward API env is fixed at container start, so restart on in-place CPU resize.
          resizePolicy:
            - { resourceName: cpu, restartPolicy: RestartContainer }
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: "2", memory: 1Gi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
