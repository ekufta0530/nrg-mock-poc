# Single-replica Redis cache. Its PDB is trap 1 (manifests/traps/01-redis-pdb/).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cache
  labels: { app: redis, team: platform }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis, team: platform }
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - { key: nrg.io/pool, operator: In, values: [memory] }
      containers:
        - name: redis
          image: public.ecr.aws/docker/library/redis:7.2-alpine
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "1536mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{ name: redis, containerPort: 6379 }]
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { memory: 2Gi }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cache
spec:
  selector: { app: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
