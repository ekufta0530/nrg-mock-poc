# routing: redis-queue + job producer. The routing-engine worker itself lives in
# manifests/traps/05-routing-worker/ (or manifests/safe/) so trap 5 can be toggled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-queue
  namespace: routing
  labels: { app: redis-queue, team: dispatch }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: redis-queue }
  template:
    metadata:
      labels: { app: redis-queue, team: dispatch }
    spec:
      containers:
        - name: redis
          image: public.ecr.aws/docker/library/redis:7.2-alpine
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "768mb"]
          ports: [{ name: redis, containerPort: 6379 }]
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 1Gi }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-queue
  namespace: routing
spec:
  selector: { app: redis-queue }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
# Pushes ~6 jobs/s. Eric reads the backlog from it:
#   kubectl -n routing port-forward svc/routing-producer 8080:80 & curl -s localhost:8080/status
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routing-producer
  namespace: routing
  labels: { app: routing-producer, team: dispatch }
spec:
  replicas: 1
  selector:
    matchLabels: { app: routing-producer }
  template:
    metadata:
      labels: { app: routing-producer, team: dispatch }
    spec:
      containers:
        - name: producer
          image: nrg-loadgen
          env:
            - { name: MODE, value: queue }
            - { name: REDIS_HOST, value: redis-queue }
            - { name: JOBS_PER_SEC, value: "6" }
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: routing-producer
  namespace: routing
spec:
  selector: { app: routing-producer }
  ports: [{ name: http, port: 80, targetPort: http }]
