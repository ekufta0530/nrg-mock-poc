# Trap 5 defused / the "real fix": concurrency decoupled from the CPU request.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routing-engine
  namespace: routing
  labels: { app: routing-engine, team: dispatch }
spec:
  replicas: 1
  selector:
    matchLabels: { app: routing-engine }
  template:
    metadata:
      labels: { app: routing-engine, team: dispatch }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: nrg-worker
          env:
            - { name: MODE, value: queue }
            - { name: SERVICE_NAME, value: routing-engine }
            - { name: REDIS_HOST, value: redis-queue }
            - { name: JOB_CPU_MS, value: "100" }
            - { name: JOB_IO_MS, value: "900" }
            - { name: WORKERS, value: "8" }
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: "2", memory: 1Gi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
