# Zone-spread trap OFF: plain label-renderer Deployment (the default).
# The strict 3-AZ variant is traps/99-label-zone-spread.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: label-renderer
  namespace: label
  labels: { app: label-renderer, team: fulfillment }
spec:
  replicas: 3
  selector:
    matchLabels: { app: label-renderer }
  template:
    metadata:
      labels: { app: label-renderer, team: fulfillment }
    spec:
      containers:
        - name: renderer
          image: nrg-worker
          env:
            - { name: MODE, value: http }
            - { name: SERVICE_NAME, value: label-renderer }
            - { name: REQUEST_CPU_MS, value: "40" }
            - { name: BALLAST_MB, value: "128" }
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
